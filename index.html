<!DOCTYPE html>
<html lang="en">
<head>
    <title>NIU Search Engine</title>
    <style>
    </style>
</head>
<body>
    <div class="container">
        <h1>NIU Search Engine</h1>
        <form id="querySubmit">
          <label>Enter Query:</label>
          <input type="text" name="query" required />
          <button type="submit">Search</button>
        </form>
        <div id="results"> <span id="resultsText">Search results show here.</span>
            <ul id="resultsList"></ul>
        </div>
    </div>
</body>
<script>
  const querySubmit = document.getElementById("querySubmit");
  const resultsText = document.getElementById("resultsText");
  const resultsList = document.getElementById("resultsList");
  const domainUrl = "https://search-engine-api-qwkq.onrender.com";
  querySubmit.addEventListener("submit", async (a) => {
    a.preventDefault();
    resultsText.textContent = "Loading..."
    const query = querySubmit.elements["query"];
    try {
        const res = await fetch(domainUrl + "/search", {
            // NEW FEATURE: MAKE ERROR MESSAGES VISIBLE ON FRONTEND
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                query: query.value,
            })
        });
        resultsText.textContent = "Searching...";
        if(!res.ok){
            var backend;
            try{
            backendData = await res.json();
            }
            catch{
                backendData = {};
            }
            throw new Error(backendData.error || `HTTP error ${res.status}`);
        }
        const newUrl = await res.json();
        if(!newUrl.query_results){
            throw new Error("No URL recieved");
        }
        console.log("response: ", newUrl.query_results);
        resultsText.textContent = "Results:";
        let queryArray = Object.entries(newUrl.query_results);
        queryArray.sort(function (a, b) { return b[1] - a[1] });
        while (resultsList.firstChild) {
          resultsList.removeChild(resultsList.firstChild);
        }
        for(let i = 0; i < 10 && i < queryArray.length; i++){
            let result = document.createElement('li');
            //result.textContent = queryArray[i][0];
            result.innerHTML = `<a href="${queryArray[i][0]}" target="_blank">${queryArray[i][0]}</a>`;
            resultsList.appendChild(result);
        }
    }
    catch(err){
        console.error("Error during search: ", err.message)
        results.textContent = `Error during generation: ${err.message}`
    }
  });
</script>
</html>
